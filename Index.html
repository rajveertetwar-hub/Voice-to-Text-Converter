<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voice to Text Converter</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100 min-h-screen flex items-center justify-center p-5">

    <!-- Main Card -->
    <div class="bg-white w-full max-w-2xl rounded-xl shadow-md p-6">

        <!-- Heading -->
        <div class="text-center mb-6">

            <div class="text-5xl mb-3">
                🎤
            </div>

            <h1 class="text-3xl font-bold text-gray-800">
                Voice to Text
            </h1>

            <p class="text-gray-500 mt-2">
                Speak and convert your voice into text
            </p>

        </div>


        <!-- Buttons -->
        <div class="flex justify-center gap-3 mb-6">

            <button
                onclick="startRecognition()"
                class="bg-blue-600 text-white px-6 py-3 rounded-lg
                       font-medium hover:bg-blue-700
                       transition duration-200"
            >
                 Start
            </button>

            <button
                onclick="stopRecognition()"
                class="bg-red-500 text-white px-6 py-3 rounded-lg
                       font-medium hover:bg-red-600
                       transition duration-200"
            >
                 Stop
            </button>

        </div>


        <!-- Status -->
        <div
            id="status"
            class="text-center text-sm text-gray-500 mb-4"
        >
            Click Start and begin speaking...
        </div>


        <!-- Output Box -->
        <div>

            <label class="block text-sm font-semibold text-gray-700 mb-2">
                Your Transcript
            </label>

            <div
                id="output"
                class="bg-gray-50 border border-gray-300
                       rounded-lg p-4 min-h-[150px]
                       text-gray-700 leading-relaxed"
            >
                Transcript will appear here...
            </div>

        </div>


        

    </div>


    <script>

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!SpeechRecognition) {

            alert("Your browser does not support Speech Recognition.");

        }

        else {

            const recognition = new SpeechRecognition();

            recognition.lang = 'en-US';

            recognition.interimResults = true;

            recognition.continuous = true;


            let finalTranscript = '';


            /* =========================
               SPEECH RESULT
            ========================= */

            recognition.onresult = (event) => {

                let interimTranscript = '';


                for (
                    let i = event.resultIndex;
                    i < event.results.length;
                    ++i
                ) {

                    const transcript =
                        event.results[i][0].transcript;


                    if (event.results[i].isFinal) {

                        finalTranscript +=
                            transcript + ' ';

                    }

                    else {

                        interimTranscript +=
                            transcript;

                    }

                }


                document.getElementById('output').innerText =
                    finalTranscript + interimTranscript;

            };


            /* =========================
               START
            ========================= */

            function startRecognition() {

                finalTranscript = '';

                recognition.start();

                document.getElementById('status').innerText =
                    '🔴 Listening... Speak now';

                document.getElementById('status').className =
                    'text-center text-sm text-red-500 mb-4 font-medium';

            }


            /* =========================
               STOP
            ========================= */

            function stopRecognition() {

                recognition.stop();

                document.getElementById('status').innerText =
                    'Recognition stopped';

                document.getElementById('status').className =
                    'text-center text-sm text-gray-500 mb-4';

            }


            /* =========================
               ERROR
            ========================= */

            recognition.onerror = (event) => {

                console.error(
                    "Speech recognition error:",
                    event.error
                );

                document.getElementById('status').innerText =
                    '⚠️ Error: ' + event.error;

            };

        }

    </script>

</body>

</html>
